# Tool configuration only; packaging lives in setup.py.

[tool.ruff]
target-version = "py310"
line-length = 110
extend-exclude = ["venv", "build", "dist", "*.spec"]

[tool.ruff.lint]
# Real bugs only: syntax errors, undefined names, unused imports/variables,
# redefinitions. Style is left to review.
select = ["E9", "F63", "F7", "F82", "F401", "F811", "F841"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
    "ignore::UserWarning",
]
