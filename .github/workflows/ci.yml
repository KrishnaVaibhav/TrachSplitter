name: CI

# Runs on every pull request to main and on every push to main.
# Branch protection requires the single "CI passed" check, which only
# succeeds when lint, tests (Linux + Windows) and the Windows app build pass.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"
  TORCH_INDEX: https://download.pytorch.org/whl/cpu

jobs:
  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Conventional commit style title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            style
            revert

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Ruff
        run: ruff check . --output-format github

  test:
    name: Tests (${{ matrix.os }}, py${{ matrix.python }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.13"
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: System libraries for Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libpulse0
      - name: Install dependencies (CPU PyTorch)
        run: |
          python -m pip install torch torchaudio --index-url ${{ env.TORCH_INDEX }}
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile all modules
        run: python -m compileall -q -x "(venv|build|dist)" .
      - name: Pytest
        run: python -m pytest -q

  build:
    name: Build Windows app
    needs: lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies (CPU PyTorch)
        run: |
          python -m pip install torch torchaudio --index-url ${{ env.TORCH_INDEX }}
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: PyInstaller build
        run: python build.py --no-package
      - name: Verify bundle
        shell: pwsh
        run: |
          $required = @(
            'dist/TrachSplitter/TrachSplitter.exe',
            'dist/TrachSplitter/_internal/demucs/remote/files.txt',
            'dist/TrachSplitter/_internal/ui_theme.py'
          )
          foreach ($f in $required) {
            if (-not (Test-Path $f)) { Write-Error "Missing from bundle: $f"; exit 1 }
          }
          $mb = [int]((Get-ChildItem dist/TrachSplitter -Recurse | Measure-Object Length -Sum).Sum / 1MB)
          "Bundle OK ($mb MB)"

  ci-passed:
    name: CI passed
    if: always()
    needs: [pr-title, lint, test, build]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs succeeded
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "One or more jobs failed or were cancelled:"
          echo '${{ toJSON(needs) }}'
          exit 1
      - run: echo "All checks green."
